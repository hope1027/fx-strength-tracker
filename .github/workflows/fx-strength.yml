name: FX Strength Snapshot

on:
  schedule:
    # UTC 時間 → 對應台灣時間（UTC+8）
    - cron: "0 0 * * *"   # UTC 00:00 → 台灣 08:00
    - cron: "0 4 * * *"   # UTC 04:00 → 台灣 12:00
    - cron: "0 8 * * *"   # UTC 08:00 → 台灣 16:00
    - cron: "0 12 * * *"  # UTC 12:00 → 台灣 20:00
    - cron: "0 16 * * *"  # UTC 16:00 → 台灣 00:00（隔日）
  workflow_dispatch: {}   # 讓你可以在 Actions 頁面手動按「Run workflow」測試

permissions:
  contents: write   # 允許把結果寫回這個 repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取快照並計算強弱分數
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fx_strength_snapshot.py

      - name: 把結果寫回 repo
        run: |
          git config user.name "fx-strength-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "快照 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
